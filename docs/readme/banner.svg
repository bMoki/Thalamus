<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1022"/>
      <stop offset="1" stop-color="#1D2147"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.27" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#8B93FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B93FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8B93FF" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <g transform="translate(250 180)">
    <rect x="-110" y="-110" width="220" height="220" rx="50" fill="#171A33" stroke="#8B93FF" stroke-opacity="0.25" stroke-width="2"/>
    <g transform="translate(-110 -110) scale(2.2)">
      <ellipse cx="36" cy="50" rx="13" ry="22" transform="rotate(-14 36 50)" fill="#8B93FF"/>
      <ellipse cx="64" cy="50" rx="13" ry="22" transform="rotate(14 64 50)" fill="#8B93FF"/>
      <circle cx="50" cy="53" r="7" fill="#E6E9F0" stroke="#171A33" stroke-width="3"/>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="420" y="178" font-size="92" font-weight="700" fill="#E6E9F0" letter-spacing="-2">Thalamus</text>
    <text x="424" y="232" font-size="30" font-weight="500" fill="#8B93FF">A IDE do <tspan font-family="'SF Mono', Menlo, Consolas, monospace">ns</tspan> para macOS</text>
    <text x="424" y="276" font-size="21" fill="#E6E9F0" fill-opacity="0.55">Sessões de IA, Serviços, banco, arquivos e PRs de cada Branch de workspace, num lugar só.</text>
  </g>
</svg>
